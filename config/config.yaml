# ==============================================================================
# nrx-bounded: Single Source of Truth Configuration File (writing-as-code)
# ==============================================================================
# All PHY, channel, neural model, training, and evaluation parameters are
# derived strictly from original notebook code and verified checkpoints.

seed: 42

phy:
  carrier_frequency: 3.5e+9            # 3.5 GHz (Hz)
  subcarrier_spacing: 30000.0          # 30 kHz (Hz)
  fft_size: 128                        # N_FFT (F dimension)
  num_ofdm_symbols: 14                 # T dimension
  num_guard_carriers: [5, 6]           # [left guard, right guard] (num_guard_carriers)
  guard_subcarriers: [5, 6]            # Alias for backward compatibility
  dc_null: true                        # 1 DC subcarrier nulled
  pilot_pattern: "kronecker"           # Kronecker pilot pattern
  pilot_ofdm_symbol_indices: [2, 11]   # Symbols containing pilots
  cyclic_prefix_length: 0              # Frequency-domain simulation
  num_effective_subcarriers: 116       # 128 - 5 - 6 - 1 = 116 useful subcarriers
  modulation:
    type: "64QAM"
    num_bits_per_symbol: 6
  coderate: 0.9                        # LDPC coderate
  num_tx_ant: 1                        # Single UT antenna
  num_tx_antennas: 1                   # Single UT antenna (alias)
  num_rx_ant: 2                        # Dual-polarized BS antenna array (SIMO 1x2)
  num_rx_antennas: 2                   # Dual-polarized BS antenna array (SIMO 1x2 alias)

channel:
  cdl_model: "C"                       # CDL model profile (original code: cdl_model = "C")
  delay_spread: 1.0e-07                # 100 ns (original code: delay_spread = 100e-9 s)
  speed: 0.0                           # Speed for evaluation and training [m/s]
  speed_1: 50.0                        # Max speed for training [m/s]
  speed_min: 0.0                       # Alias for Sionna min_speed
  speed_max: 50.0                      # Alias for Sionna max_speed

models:
  proposed_axial:
    d_model: 128                       # Embedding dimension (num_conv_channels)
    num_conv_channels: 128             # Alias for d_model
    num_heads: 4                       # Multi-head attention heads (nhead)
    num_layers: 6                      # 6 factorized axial attention blocks
    dim_feedforward: 256               # FFN intermediate dimension (2 * d_model)
    dropout: 0.1
    in_channels: 12                    # 12-channel concatenated tensor (D8)
    max_time: 14                       # Max time dimension for 2D PosEnc
    max_freq: 128                      # Max freq dimension for 2D PosEnc
  baseline_cnn:
    num_conv_channels: 128
    num_blocks: 11                     # 11 residual convolutional blocks
    in_channels: 5                     # 5-channel concatenated tensor (D8 CNN)

training:
  optimizer: "AdamW"
  learning_rate: 0.0001                # 1e-4
  weight_decay: 0.0001                 # 1e-4
  batch_size: 16                       # training_batch_size
  training_batch_size: 16              # Alias for batch_size
  gradient_accumulation_steps: 8       # accumulation_steps
  effective_batch_size: 128            # 16 * 8 = 128
  iterations: 100000                   # num_training_iterations
  ebno_db_min: 0.0                     # Min Eb/N0 in training
  ebno_db_max: 20.0                    # Max Eb/N0 in training
  device: "cuda"

paths:
  plots_dir: "plots"

evaluation:
  ebno_db_min: 0.0
  ebno_db_max: 20.0
  ebno_db_step: 0.5                    # Original code: np.arange(..., 0.5) (NOT 2.0)
  batch_size: 128
  num_target_block_errors: 100
  max_mc_iter: 1000
  target_bler: 0.0001
  plots_dir: "plots"
  save_plots: true
